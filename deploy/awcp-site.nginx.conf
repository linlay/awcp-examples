server {
    listen 80;
    server_name awcp-site.zenmind.cc;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/awcp-site;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl http2;
    server_name awcp-site.zenmind.cc;
    ssl_certificate /etc/letsencrypt/live/awcp-site.zenmind.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/awcp-site.zenmind.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    # Browser SSE: distinct from the MCP transport endpoint.
    location = /api/v1/events {
        proxy_pass http://127.0.0.1:11983;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        gzip off;
        proxy_cache off;
        proxy_read_timeout 65s;
    }
    location / {
        proxy_pass http://127.0.0.1:11983;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
